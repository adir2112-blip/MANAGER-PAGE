<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>לוח משימות</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Heebo',sans-serif;direction:rtl;background:#F0EDE6;min-height:100vh;color:#1A1A1A}

    .header{background:#1A1A1A;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
    .header-title{font-size:16px;font-weight:800;color:#fff}
    .header-sub{font-size:11px;color:#888;margin-top:2px}

    .main{padding:1.5rem;max-width:760px;margin:0 auto}

    .card{background:#fff;border:1px solid #E8E4DC;border-radius:16px;box-shadow:0 1px 6px rgba(0,0,0,.04);margin-bottom:1.2rem;overflow:hidden}
    .card-header{padding:.9rem 1.3rem;border-bottom:1px solid #F0EDE6;background:#FAFAF8;font-size:13px;font-weight:800}

    .form-wrap{padding:1.1rem 1.3rem;display:flex;flex-direction:column;gap:.75rem}
    .form-row{display:flex;gap:.6rem;flex-wrap:wrap}
    .form-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
    .form-group label{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px}
    .form-input,.form-select{background:#F8F6F2;border:1.5px solid #E8E4DC;border-radius:10px;padding:8px 12px;font-size:13.5px;font-family:'Heebo',sans-serif;color:#1A1A1A;outline:none}
    .form-input:focus,.form-select:focus{border-color:#1A1A1A;background:#fff}
    .add-btn{background:#1A1A1A;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:'Heebo',sans-serif;align-self:flex-end}
    .add-btn:hover{background:#333}

    .task-row{display:flex;align-items:flex-start;gap:.75rem;padding:.85rem 1.3rem;border-bottom:1px solid #F8F6F2}
    .task-row:last-child{border-bottom:none}
    .task-check{width:24px;height:24px;border-radius:7px;border:2px solid #E8E4DC;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
    .task-check:hover{border-color:#1A1A1A}
    .task-body{flex:1}
    .task-text{font-size:14px;font-weight:600;color:#1A1A1A}
    .task-meta{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:5px}
    .assignee-tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:#EFF6FF;color:#1D4ED8}
    .due-chip{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
    .due-ok{background:#DCFCE7;color:#166534}
    .due-soon{background:#FEF9C3;color:#854D0E}
    .due-late{background:#FEE2E2;color:#991B1B}
    .due-none{background:#F0EDE6;color:#888}
    .done-meta{font-size:11px;color:#888;margin-top:4px}
    .del-x{background:none;border:none;color:#C0BDB6;cursor:pointer;font-size:16px;flex-shrink:0;padding:2px 6px}
    .del-x:hover{color:#DC2626}
    .empty-msg{padding:2rem;text-align:center;color:#C0BDB6;font-size:13px}
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="header-title">📋 לוח משימות</div>
      <div class="header-sub">אדיר ואורי</div>
    </div>
  </div>

  <div class="main">

    <div class="card">
      <div class="card-header">➕ משימה חדשה</div>
      <div class="form-wrap">
        <div class="form-row">
          <div class="form-group" style="flex:2">
            <label>תיאור המשימה</label>
            <input class="form-input" id="newText" placeholder="תיאור המשימה..."/>
          </div>
          <div class="form-group">
            <label>אחראי</label>
            <select class="form-select" id="newAssignee">
              <option value="אדיר לוי">אדיר</option>
              <option value="אורי">אורי</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>יעד לטיפול (SLA, אופציונלי)</label>
            <input class="form-input" id="newDue" type="datetime-local"/>
          </div>
          <button class="add-btn" onclick="addTask()">הוסף משימה</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">⏳ פתוחות</div>
      <div id="openList"><div class="empty-msg">טוען...</div></div>
    </div>

    <div class="card">
      <div class="card-header">✅ הושלמו</div>
      <div id="doneList"><div class="empty-msg">טוען...</div></div>
    </div>

  </div>

<script>
const SB_URL='https://mxgqhzjhiepjchhofclc.supabase.co/rest/v1';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14Z3FoempoaWVwamNoaG9mY2xjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMDQwNzYsImV4cCI6MjA5NzU4MDA3Nn0._1PRPhD6H0F7Cgm4VBp1Q0dn0DLpgnPre1KSusoZWhg';
const H={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};

function sb(path){return fetch(SB_URL+path,{headers:H}).then(r=>r.json());}
function fmtDue(iso){
  const d=new Date(iso);
  return d.toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function dueStatus(iso){
  if(!iso) return {cls:'due-none',label:'ללא יעד'};
  const diffMin=(new Date(iso)-new Date())/60000;
  if(diffMin<0) return {cls:'due-late',label:'יעד: '+fmtDue(iso)+' (באיחור)'};
  if(diffMin<24*60) return {cls:'due-soon',label:'יעד: '+fmtDue(iso)};
  return {cls:'due-ok',label:'יעד: '+fmtDue(iso)};
}

async function addTask(){
  const text=document.getElementById('newText').value.trim();
  const assignee=document.getElementById('newAssignee').value;
  const dueVal=document.getElementById('newDue').value;
  if(!text){alert('הזן תיאור משימה');return;}
  const due_at=dueVal?new Date(dueVal).toISOString():null;
  await fetch(SB_URL+'/shared_tasks',{method:'POST',headers:H,body:JSON.stringify({
    task_text:text,assigned_to:assignee,created_by:assignee,due_at
  })});
  document.getElementById('newText').value='';
  document.getElementById('newDue').value='';
  loadTasks();
}

async function completeTask(id,assignee){
  const who=prompt('מי ביצע את המשימה?',assignee||'');
  if(who===null) return;
  await fetch(SB_URL+'/shared_tasks?id=eq.'+id,{method:'PATCH',headers:H,body:JSON.stringify({
    completed_at:new Date().toISOString(),completed_by:who.trim()||assignee
  })});
  loadTasks();
}

async function deleteTask(id){
  if(!confirm('למחוק את המשימה?'))return;
  await fetch(SB_URL+'/shared_tasks?id=eq.'+id,{method:'DELETE',headers:H});
  loadTasks();
}

async function loadTasks(){
  const [open,done]=await Promise.all([
    sb('/shared_tasks?select=*&completed_at=is.null&order=due_at.asc.nullslast,created_at.asc'),
    sb('/shared_tasks?select=*&completed_at=not.is.null&order=completed_at.desc&limit=50')
  ]);

  const openEl=document.getElementById('openList');
  openEl.innerHTML=(Array.isArray(open)&&open.length)?open.map(t=>{
    const due=dueStatus(t.due_at);
    return `<div class="task-row">
      <div class="task-check" onclick="completeTask('${t.id}','${(t.assigned_to||'').replace(/'/g,"")}')"></div>
      <div class="task-body">
        <div class="task-text">${t.task_text}</div>
        <div class="task-meta">
          <span class="assignee-tag">${t.assigned_to}</span>
          <span class="due-chip ${due.cls}">${due.label}</span>
        </div>
      </div>
      <button class="del-x" onclick="deleteTask('${t.id}')">✕</button>
    </div>`;
  }).join(''):'<div class="empty-msg">אין משימות פתוחות 🎉</div>';

  const doneEl=document.getElementById('doneList');
  doneEl.innerHTML=(Array.isArray(done)&&done.length)?done.map(t=>`
    <div class="task-row">
      <div class="task-body">
        <div class="task-text" style="text-decoration:line-through;color:#AAA">${t.task_text}</div>
        <div class="task-meta"><span class="assignee-tag">${t.assigned_to}</span></div>
        <div class="done-meta">בוצע ע״י ${t.completed_by||'—'} · ${fmtDue(t.completed_at)}</div>
      </div>
      <button class="del-x" onclick="deleteTask('${t.id}')">✕</button>
    </div>`).join(''):'<div class="empty-msg">עדיין לא הושלמה אף משימה</div>';
}

loadTasks();
setInterval(loadTasks,60000);
</script>
</body>
</html>
